<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060d1a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      var root = document.documentElement
      root.classList.add('js')

      // Links para seções (#contato etc.): as seções fora da tela ficam "adormecidas"
      // (content-visibility) para a página abrir rápido; antes de rolar até uma âncora,
      // todas são montadas (.cv-off) para o destino ficar exatamente no lugar.
      if (location.hash) root.classList.add('cv-off')
      document.addEventListener(
        'click',
        function (e) {
          var a = e.target.closest && e.target.closest('a[href*="#"]')
          if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return
          var u = new URL(a.href, location.href)
          if (u.origin !== location.origin || u.pathname !== location.pathname || !u.hash) return
          var t = document.getElementById(decodeURIComponent(u.hash.slice(1)))
          if (!t) return
          e.preventDefault()
          root.classList.add('cv-off')
          t.scrollIntoView()
          if (location.hash !== u.hash) history.pushState(null, '', u.hash)
          if (!t.hasAttribute('tabindex')) t.setAttribute('tabindex', '-1')
          t.focus({ preventScroll: true })
        },
        true,
      )

      // Animação de entrada ao rolar (fade + leve subida). Não depende do React.
      addEventListener('DOMContentLoaded', function () {
        var els = document.querySelectorAll('.reveal')
        if (!('IntersectionObserver' in window)) {
          els.forEach(function (e) { e.classList.add('is-visible') })
          return
        }
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting) {
                e.target.classList.add('is-visible')
                io.unobserve(e.target)
              }
            })
          },
          { rootMargin: '0px 0px -8% 0px', threshold: 0.08 },
        )
        els.forEach(function (e) { io.observe(e) })
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
